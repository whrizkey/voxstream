name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@1edb52594c857d2b581dd6427b003c73d770cdd6 # v3.0.0
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318edeed9793cb12b3ab9237857 # v5.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Ruff Formatter check
        run: uv run ruff format --check .

      - name: Run Mypy Type Checker
        run: uv run mypy

      - name: Dependency vulnerability audit
        run: uvx pip-audit

  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    needs: lint-and-typecheck
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Set up FFmpeg (Windows)
        if: runner.os == 'Windows'
        uses: FedericoCarboni/setup-ffmpeg@fb667d50f3400dd34d47950417647a87eb496771 # v3

      - name: Install uv
        uses: astral-sh/setup-uv@1edb52594c857d2b581dd6427b003c73d770cdd6 # v3.0.0
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@0b93645e9fea7318edeed9793cb12b3ab9237857 # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run Pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest
